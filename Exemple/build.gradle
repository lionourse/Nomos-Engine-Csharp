plugins {
    id 'application'
}

group = 'fr.olympus-engine'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'fr.olympus.nomos.example.Main'
}
